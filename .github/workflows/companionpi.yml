name: CompanionPi Build
run-name: "CompanionPi Build - ${{ github.event.inputs.companion-ref || 'beta' }}"

permissions: {}

env:
  # Images are registered as a build target of the main Companion product, so they
  # appear alongside the regular Companion builds of the same version
  API_PRODUCT: companion
  API_TARGET: linux-img

on:
  push:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      # publish-branch:
      #   type: choice
      #   description: Release branch (on the website)
      #   default: beta
      #   options:
      #     - stable
      #     - beta
      #   required: true
      companion-ref:
        type: string
        description: Companion tag to build as new stable
        default: beta
        required: true
  schedule:
    - cron: "0 0 * * SUN"

concurrency:
  group: ${{ github.event.inputs.companion-ref || github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: build image

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Determine build details
        id: info
        shell: bash
        env:
          INPUT_REF: ${{ github.event.inputs.companion-ref }}
        run: |
          echo "sourcename=output-companionpi/image.xz" >> $GITHUB_OUTPUT

          if [[ -z "${INPUT_REF}" || "${INPUT_REF}" == "beta" ]]
          then
            # Automatic (or manually triggered) beta build
            echo "branch=beta" >> $GITHUB_OUTPUT
            echo "ref=beta" >> $GITHUB_OUTPUT
          else
            # Manual stable build. We assume a semver tag was supplied
            echo "branch=stable" >> $GITHUB_OUTPUT
            echo "ref=${INPUT_REF}" >> $GITHUB_OUTPUT
          fi

      - name: Do build
        id: build
        uses: ./.github/actions/do-build
        with:
          companion-ref: ${{ steps.info.outputs.ref }}
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine artifact names
        id: names
        shell: bash
        env:
          BRANCH: ${{ steps.info.outputs.branch }}
          REF: ${{ steps.info.outputs.ref }}
          # The Companion version installed in the image (contents of /opt/companion/BUILD),
          # eg 5.0.0+9502-main-<hash>. This is the same string Companion reports for its own builds
          BUILD: ${{ steps.build.outputs.companion-version }}
        run: |
          if [[ -z "${BUILD}" ]]; then
            echo "Failed to determine the Companion version in the image"
            exit 1
          fi

          if [[ "${BRANCH}" == "beta" ]]
          then
            # Matches the version Companion registers for its beta builds
            echo "version=${BUILD}" >> $GITHUB_OUTPUT
          else
            # Companion registers stable builds by their tag name, so match that.
            # Guard against registering an image under the wrong release
            if [[ "${BUILD}" != "${REF#v}+"* ]]; then
              echo "Image contains Companion ${BUILD}, which does not match tag ${REF}"
              exit 1
            fi
            echo "version=${REF}" >> $GITHUB_OUTPUT
          fi

          # Sanitise the version for use in a filename ('+' -> '-', drop anything else).
          # The run number keeps the filename unique when an image is rebuilt for the same
          # Companion version (eg for an updated Raspberry Pi OS base image)
          SAFE_BUILD="$(echo "${BUILD}" | tr '+' '-' | tr -cd 'A-Za-z0-9._-')"
          echo "targetname=companion-pi-${BRANCH}-${SAFE_BUILD}-${{ github.run_number }}.img.xz" >> $GITHUB_OUTPUT

      - name: Upload build (beta)
        uses: bitfocus/actions/upload-and-notify-for-branch@main
        if: ${{ github.repository_owner == 'bitfocus' && steps.info.outputs.branch == 'beta' }}
        with:
          source-filename: ${{ steps.info.outputs.sourcename }}
          destination-filename: ${{ steps.names.outputs.targetname }}
          s3-host: ${{ vars.S3_HOST }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          s3-access-key: ${{ secrets.S3_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET }}

          api-version: ${{ steps.names.outputs.version }}
          api-branch: 'beta'
          api-product: ${{ env.API_PRODUCT }}
          api-target: ${{ env.API_TARGET }}
          api-secret: ${{ secrets.BITFOCUS_API_PROJECT_SECRET }}

      - name: Upload build (stable)
        uses: bitfocus/actions/upload-and-notify-for-branch@main
        if: ${{ github.repository_owner == 'bitfocus' && steps.info.outputs.branch == 'stable' }}
        with:
          source-filename: ${{ steps.info.outputs.sourcename }}
          destination-filename: ${{ steps.names.outputs.targetname }}
          s3-host: ${{ vars.RELEASE_S3_HOST }}
          s3-bucket: ${{ vars.RELEASE_S3_BUCKET }}/${{ env.API_PRODUCT }}
          s3-access-key: ${{ secrets.RELEASE_S3_KEY }}
          s3-secret-key: ${{ secrets.RELEASE_S3_SECRET }}

          public-bucket-url: ${{ vars.RELEASE_S3_URL }}/${{ env.API_PRODUCT }}

          api-version: ${{ steps.names.outputs.version }}
          api-branch: 'stable'
          api-product: ${{ env.API_PRODUCT }}
          api-target: ${{ env.API_TARGET }}
          api-secret: ${{ secrets.BITFOCUS_API_PROJECT_SECRET }}
